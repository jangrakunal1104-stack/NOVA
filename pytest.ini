[pytest]
# By default pytest crawls the whole rootdir for anything matching
# test_*.py / *_test.py. Without this, it also picks up:
#  - llama.cpp/ (a vendored third-party repo, has its own test suite with
#    its own unrelated dependencies like `appium`)
#  - the legacy root-level test_jarvis.py / test_chain.py scripts, which
#    are manual smoke-test scripts (not real pytest tests) left over from
#    earlier iterations of the project
# Scoping to tests/ keeps `pytest` fast, quiet, and limited to the real
# suite.
testpaths = tests
norecursedirs = llama.cpp genv .git models mrblack_model datasets nova_chroma_db nova_qdrant_storage nova_memory_db outputs
